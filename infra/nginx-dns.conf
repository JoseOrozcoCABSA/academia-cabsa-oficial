map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/academia.crt;
    ssl_certificate_key /etc/nginx/tls/academia.key;
    client_max_body_size 30m;
    location / { proxy_pass http://frontend-academia:8080; include /etc/nginx/proxy_params; }
}

server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/academia.crt;
    ssl_certificate_key /etc/nginx/tls/academia.key;
    client_max_body_size 30m;
    location / { proxy_pass http://frontend-administracion:8080; include /etc/nginx/proxy_params; }
}

server {
    listen 9443 ssl;
    ssl_certificate /etc/nginx/tls/academia.crt;
    ssl_certificate_key /etc/nginx/tls/academia.key;
    client_max_body_size 30m;
    location / {
        proxy_pass http://api-gateway:6080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

