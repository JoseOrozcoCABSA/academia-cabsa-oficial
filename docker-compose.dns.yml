services:
  https-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend-academia: { condition: service_started }
      frontend-administracion: { condition: service_started }
      api-gateway: { condition: service_healthy }
    environment:
      PORTAL_HOST: ${DNS_PORTAL_HOST:-usuarios.academiacabsa.com}
      ADMIN_HOST: ${DNS_ADMIN_HOST:-administracion.academiacabsa.com}
      API_HOST: ${DNS_API_HOST:-api.academiacabsa.com}
    # Apache del host conserva el puerto 80; este proxy termina HTTPS en 443.
    ports: ["443:443"]
    networks: [academia-interna]
    volumes:
      - ./infra/nginx-dns.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certificados/academia-local.crt:/etc/nginx/tls/academia.crt:ro
      - ./certificados/academia-local.key:/etc/nginx/tls/academia.key:ro
    mem_limit: 96m
    cpus: 0.5
