services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:?Configura DB_NAME en .env}
    expose:
      - "3306"
    networks:
      - academia-interna
    volumes:
      - academia-mysql:/var/lib/mysql
      - ./mysql/inicial:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 1024m
    cpus: 2.0

volumes:
  academia-mysql:
